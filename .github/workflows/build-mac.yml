name: CI-Mac

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Use pnpm 11
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
          run_install: false
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Rebuild native image dependency
        run: pnpm rebuild sharp
      - name: Type-check
        run: pnpm tsc
      - name: Run offline tests
        run: pnpm test
      - name: Build macOS installer
        run: pnpm build
        env:
          CI: true
          CI_ENV: Github Action
      - name: Read package version
        id: package-version
        run: echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ steps.package-version.outputs.version }}
        run: |
          tag="mac-${PACKAGE_VERSION}"
          installer="release/稳部落-${PACKAGE_VERSION}.dmg"
          test -f "${installer}"
          gh release create "${tag}" --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --title "${PACKAGE_VERSION}" --draft --prerelease
      - name: Upload macOS installer
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ steps.package-version.outputs.version }}
        run: |
          tag="mac-${PACKAGE_VERSION}"
          installer="release/稳部落-${PACKAGE_VERSION}.dmg"
          gh release upload "${tag}" "${installer}" --repo "${GITHUB_REPOSITORY}"
