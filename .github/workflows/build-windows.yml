name: CI-Windows

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use pnpm 11
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
          run_install: false
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm tsc
      - name: Run offline tests
        run: pnpm test
      - name: Build Windows installer
        run: pnpm build
        env:
          CI: true
          CI_ENV: Github Action
      - name: Read package version
        id: package-version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ steps.package-version.outputs.version }}
        run: |
          $tag = "win-$env:PACKAGE_VERSION"
          $installer = "release/稳部落 Setup $env:PACKAGE_VERSION.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "Release installer is missing: $installer"
          }
          gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title $env:PACKAGE_VERSION --draft --prerelease
      - name: Upload Windows installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ steps.package-version.outputs.version }}
        run: |
          $tag = "win-$env:PACKAGE_VERSION"
          $installer = "release/稳部落 Setup $env:PACKAGE_VERSION.exe"
          gh release upload $tag $installer --repo $env:GITHUB_REPOSITORY
